# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
#
# The server and the machine-learning image are one release split across two
# containers: Immich supports no combination where they differ, so both
# version variables carry the same version and move together.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259}}
  postgres: &postgres-image ${IMMICH_POSTGRES_IMAGE_TAG:-ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_IMAGE_VERSION:-17-vectorchord0.4.3-pgvector0.8.0@sha256:51f6abbfc720dde5cad9a39133d1c5247da8f073a449004da781c07b2cd9ee9c}}
  redis: &redis-image ${IMMICH_REDIS_IMAGE_TAG:-valkey/valkey:${IMMICH_REDIS_IMAGE_VERSION:-9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d}}
  immich-server: &immich-server-image ${IMMICH_SERVER_IMAGE_TAG:-ghcr.io/immich-app/immich-server:${IMMICH_SERVER_IMAGE_VERSION:-v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb}}
  immich-machine-learning: &immich-ml-image ${IMMICH_ML_IMAGE_TAG:-ghcr.io/immich-app/immich-machine-learning:${IMMICH_ML_IMAGE_VERSION:-v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e}}

networks:
  immich-network:
    external: true
  traefik-network:
    external: true

volumes:
  immich-library:
  immich-postgres:
  immich-model-cache:
  immich-postgres-backup:
  immich-library-backups:
  immich-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (chown its data directory, drop to its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, and killed halfway the next start does crash recovery. Sixty
    # seconds, overridable in .env.
    stop_grace_period: ${IMMICH_POSTGRES_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. IMMICH_POSTGRES_MEMORY_LIMIT=4g);
    # the override survives every git pull. Immich's own requirements page asks
    # for at least 2g here when limits are in use.
    deploy:
      resources:
        limits:
          memory: ${IMMICH_POSTGRES_MEMORY_LIMIT:-2g}
          cpus: "${IMMICH_POSTGRES_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${IMMICH_POSTGRES_MEMORY_RESERVATION:-256m}
          cpus: "${IMMICH_POSTGRES_CPU_RESERVATION:-0.25}"
    # PostgreSQL puts its parallel-query and sort scratch in /dev/shm; the
    # 64m Docker gives by default is where large library queries fail.
    shm_size: ${IMMICH_POSTGRES_SHM_SIZE:-128mb}
    volumes:
      - immich-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_USER: ${IMMICH_DB_USER:-immichdbuser}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set in .env - see .env.example for generation command}
      # Data checksums turn silent bit rot into a loud error. initdb-time
      # only: it applies when this volume is first created, and cannot be
      # switched on later without recreating the cluster.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # SSD or HDD. Selects which tuned postgresql.conf the image loads;
      # shared_preload_libraries for VectorChord lives in there, which is why
      # this compose file passes no `command:` overrides the way older Immich
      # instructions did.
      DB_STORAGE_TYPE: ${IMMICH_DB_STORAGE_TYPE:-SSD}
    networks:
      - immich-network
    healthcheck:
      # The image's own script: pg_isready, and then a count of checksum
      # failures across every database. Its built-in schedule is a five-minute
      # interval, which is too slow for `depends_on` on a cold start.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (chown its data directory, drop to its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Immich keeps only its job queues here and rebuilds them, but a Valkey
    # killed mid-save still leaves a corrupt dump for the next start to
    # complain about. Sixty seconds, overridable in .env.
    stop_grace_period: ${IMMICH_REDIS_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. IMMICH_REDIS_MEMORY_LIMIT=1g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${IMMICH_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${IMMICH_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${IMMICH_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${IMMICH_REDIS_CPU_RESERVATION:-0.1}"
    networks:
      - immich-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  immich-machine-learning:
    image: *immich-ml-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. IMMICH_ML_MEMORY_LIMIT=4g);
    # the override survives every git pull. A model is loaded on demand and
    # unloaded again after MACHINE_LEARNING_MODEL_TTL seconds; the limit has to
    # cover the largest model you enable, not the idle footprint.
    deploy:
      resources:
        limits:
          memory: ${IMMICH_ML_MEMORY_LIMIT:-3g}
          cpus: "${IMMICH_ML_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${IMMICH_ML_MEMORY_RESERVATION:-256m}
          cpus: "${IMMICH_ML_CPU_RESERVATION:-0.25}"
    volumes:
      # Downloaded models. Losing it costs a re-download, not data.
      - immich-model-cache:/cache
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
      # Seconds an idle model stays resident before it is unloaded. Workers
      # exiting after this are normal, not a crash.
      MACHINE_LEARNING_MODEL_TTL: ${IMMICH_ML_MODEL_TTL:-300}
    networks:
      - immich-network
    restart: unless-stopped

  immich-server:
    image: *immich-server-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. IMMICH_MEMORY_LIMIT=4g);
    # the override survives every git pull. Immich asks for 6g across the whole
    # stack; this is the share that uploads and transcoding run in.
    deploy:
      resources:
        limits:
          memory: ${IMMICH_MEMORY_LIMIT:-3g}
          cpus: "${IMMICH_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${IMMICH_MEMORY_RESERVATION:-256m}
          cpus: "${IMMICH_CPU_RESERVATION:-0.5}"
    volumes:
      # Originals, thumbnails, transcoded video, profile images and Immich's
      # own nightly database dumps. This is the library.
      - immich-library:/data
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
      DB_HOSTNAME: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      DB_USERNAME: ${IMMICH_DB_USER:-immichdbuser}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set in .env - see .env.example for generation command}
      REDIS_HOSTNAME: redis
      REDIS_PORT: 6379
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    networks:
      - immich-network
      - traefik-network
    healthcheck:
      # The image's own probe: GET /api/server/ping, which must answer
      # exactly {"res":"pong"}. Its built-in form carries no start period, and
      # the first boot runs database migrations before it answers anything.
      test: ["CMD", "immich-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 240s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.immich.rule=Host(`${IMMICH_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.immich.service=immich"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.immich.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      # Enable TLS on this router
      - "traefik.http.routers.immich.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.immich.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.immich.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Uploading a video is a single large request; the default 4 MiB
      # in-memory buffer is not the limit, but the read timeouts are, and a
      # phone on a slow link will hit them mid-upload.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=${IMMICH_UPLOAD_TIMEOUT:-600s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=${IMMICH_UPLOAD_TIMEOUT:-600s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=${IMMICH_UPLOAD_TIMEOUT:-600s}"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    # The same image the database runs, so pg_dump is the server's own major
    # version and the dump restores into it without a version argument.
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs to write archives it owns.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. IMMICH_BACKUPS_MEMORY_LIMIT=1g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${IMMICH_BACKUPS_MEMORY_LIMIT:-512m}
          cpus: "${IMMICH_BACKUPS_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${IMMICH_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${IMMICH_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$POSTGRES_BACKUPS_PATH/$$POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        # --clean --if-exists is what Immich documents for its own dumps, and
        # what its restore path expects: the dump drops what it is about to
        # recreate instead of failing against a populated schema.
        if pg_dump --clean --if-exists -h postgres -p 5432 -d $$IMMICH_DB_NAME -U $$IMMICH_DB_USER | gzip > "$$DB_FILE.partial"; then
          mv "$$DB_FILE.partial" "$$DB_FILE";
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE.partial" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting library backup to $$DATA_FILE";
        # thumbs and encoded-video are regenerated from the originals by a job
        # in the web UI, and together they are usually larger than the
        # originals themselves; backups/ holds Immich own nightly dumps, which
        # this loop already takes properly. Excluding all three keeps the
        # archive to what cannot be rebuilt. Override IMMICH_BACKUP_EXCLUDES
        # to include them.
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure.
        tar -zcpf "$$DATA_FILE.partial" $$IMMICH_BACKUP_EXCLUDES "$$DATA_PATH"; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          mv "$$DATA_FILE.partial" "$$DATA_FILE";
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$POSTGRES_BACKUPS_PATH" -type f -name "$$POSTGRES_BACKUP_NAME-*" -mtime "+$$POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - immich-postgres-backup:/var/lib/postgresql/data
      - immich-library:${DATA_PATH:-/data}
      - immich-library-backups:${DATA_BACKUPS_PATH:-/srv/immich-library/backups}
      - immich-database-backups:${POSTGRES_BACKUPS_PATH:-/srv/immich-postgres/backups}
    environment:
      IMMICH_DB_NAME: ${IMMICH_DB_NAME:-immich}
      IMMICH_DB_USER: ${IMMICH_DB_USER:-immichdbuser}
      PGPASSWORD: ${IMMICH_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      POSTGRES_BACKUP_PRUNE_DAYS: ${POSTGRES_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      POSTGRES_BACKUPS_PATH: ${POSTGRES_BACKUPS_PATH:-/srv/immich-postgres/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/immich-library/backups}
      DATA_PATH: ${DATA_PATH:-/data}
      POSTGRES_BACKUP_NAME: ${POSTGRES_BACKUP_NAME:-immich-postgres-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-immich-library-backup}
      IMMICH_BACKUP_EXCLUDES: ${IMMICH_BACKUP_EXCLUDES:---exclude=thumbs --exclude=encoded-video --exclude=backups}
    healthcheck:
      # This runs the database image, so it inherits that image's own
      # HEALTHCHECK - which asks a PostgreSQL server that is not running here
      # whether it is ready, gets "no response", and marks the container
      # unhealthy forever. Nothing waits on this container's health, and the
      # upgrade drill in CI waits for every container to be healthy, so an
      # inherited probe that can never pass would hang the run.
      disable: true
    networks:
      - immich-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
